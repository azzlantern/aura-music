name: deploy

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check and build
        run: bun run build

      # Publishes to the gh-pages branch, which is what this repository's Pages
      # site is configured to serve. The build keeps the default /aura-music/
      # base so the assets resolve under https://<owner>.github.io/aura-music/.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web-player/dist
          publish_branch: gh-pages
          commit_message: "Deploy to gh-pages: ${{ github.sha }}"